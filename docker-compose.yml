version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: oasis_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oasisdb
      MYSQL_USER: oasisuser
      MYSQL_PASSWORD: oasispass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oasis_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/oasisdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: oasisuser
      SPRING_DATASOURCE_PASSWORD: oasispass
      SPRING_PROFILES_ACTIVE: dev
      LOGSTASH_HOST: logstash
    ports:
      - "8080:8080"
    networks:
      - backend-network
      - elk-network

  frontend:
    build:
      context: ./frontend/reservas-app
      dockerfile: Dockerfile
    container_name: oasis_frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - backend-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: oasis_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: oasis_logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - elk-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: oasis_kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - elk-network

volumes:
  db_data:
  es_data:

networks:
  backend-network:
    driver: bridge
  elk-network:
    driver: bridge