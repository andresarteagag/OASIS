<main class="shell" [attr.aria-busy]="cargando">
  <header class="page-head">
    <div>
      <h1>Usuarios</h1>
      <p class="lead">{{ usuarios.length }} registrados. Crea, edita o elimina cuentas.</p>
    </div>
    <button type="button" class="btn btn-primary" (click)="nuevo()" *ngIf="!mostrarForm">Nuevo usuario</button>
  </header>

  <form class="panel grid-2" *ngIf="mostrarForm" (ngSubmit)="guardar()">
    <h2 class="full">{{ editando ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    <div class="form-group"><label for="u-n">Nombre</label><input id="u-n" [(ngModel)]="form.nombre" name="nombre" required></div>
    <div class="form-group"><label for="u-a">Apellidos</label><input id="u-a" [(ngModel)]="form.apellidos" name="apellidos" required></div>
    <div class="form-group"><label for="u-c">Cédula</label><input id="u-c" [(ngModel)]="form.cedula" name="cedula" required></div>
    <div class="form-group">
      <label for="u-m">Correo institucional</label>
      <input id="u-m" type="email" [(ngModel)]="form.correoInstitucional" name="correo" [disabled]="!!editando"
             placeholder="usuario@soyudemedellin.edu.co" required>
    </div>
    <div class="form-group full">
      <label for="u-p">{{ editando ? 'Nueva contraseña (opcional)' : 'Contraseña (mínimo 6 caracteres)' }}</label>
      <input id="u-p" type="password" [(ngModel)]="form.contrasena" name="contrasena" [required]="!editando">
    </div>
    <div class="acciones full">
      <button type="submit" class="btn btn-primary">{{ editando ? 'Guardar cambios' : 'Crear usuario' }}</button>
      <button type="button" class="btn btn-secondary" (click)="descartar()">Cancelar</button>
    </div>
  </form>

  <div class="tabla-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>Cédula</th><th>Correo</th><th>Rol</th><th><span class="sr-only">Acciones</span></th></tr></thead>
      <tbody>
        <tr *ngFor="let u of usuarios">
          <td>{{ u.nombre }} {{ u.apellidos }}</td>
          <td>{{ u.cedula }}</td>
          <td>{{ u.correoInstitucional }}</td>
          <td><span class="chip" [class.chip-mute]="u.rol !== 'ADMIN'">{{ u.rol === 'ADMIN' ? 'Admin' : 'Usuario' }}</span></td>
          <td class="acciones-fila">
            <button type="button" class="btn btn-secondary btn-sm" (click)="editar(u)">Editar</button>
            <button type="button" class="btn btn-danger btn-sm" (click)="eliminar(u)" *ngIf="u.rol !== 'ADMIN'">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
