<main class="split">
  <section class="pitch">
    <svg viewBox="0 0 300 440" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <rect x="10" y="10" width="280" height="420"/>
      <line x1="10" y1="220" x2="290" y2="220"/>
      <circle cx="150" cy="220" r="40"/>
      <rect x="70" y="10" width="160" height="70"/>
      <rect x="110" y="10" width="80" height="28"/>
      <path d="M110 80 A40 40 0 0 0 190 80"/>
      <rect x="70" y="360" width="160" height="70"/>
      <rect x="110" y="402" width="80" height="28"/>
      <path d="M110 360 A40 40 0 0 1 190 360"/>
      <circle class="balon" cx="150" cy="220" r="7"/>
    </svg>
    <div>
      <h1>Reserva tu cancha sin hacer fila.</h1>
      <p>Elige escenario, fecha y hora. Tu reserva queda confirmada al instante.</p>
    </div>
  </section>

  <section class="access">
    <img src="assets/images/logo-udem.png" alt="Universidad de Medellín" class="logo">
    <h2>Ingresar</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" [(ngModel)]="credenciales.correoInstitucional"
               name="correoInstitucional" placeholder="usuario@soyudemedellin.edu.co" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="credenciales.contrasena"
               name="contrasena" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn" [disabled]="cargando">{{ cargando ? 'Ingresando…' : 'Ingresar' }}</button>

      <div class="links">
        <a routerLink="/registro" class="link">¿No tienes cuenta? Regístrate</a>
      </div>
    </form>
  </section>
</main>
